buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.2")
    }
}

// Force every native library onto the NDK declared above. Libraries that don't
// pin their own ndkVersion (e.g. react-native-worklets-core) otherwise fall back
// to the Android Gradle Plugin default and trigger a second NDK download.
subprojects {
    plugins.withId("com.android.library") {
        android {
            ndkVersion rootProject.ext.ndkVersion
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
